<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Metadata -->
    <title>Aetheria – Creative Director & Frontend Engineer Portfolio</title>
    <meta
      name="description"
      content="Portfolio of a Senior Creative Director & Frontend Engineer specializing in tactile digital products, architectural design systems, and high-performance web applications."
    />
    <meta name="author" content="Shuvo Ahmed" />
    <meta name="keywords" content="Portfolio, Creative Director, Frontend Engineer, React, TypeScript, UI/UX, Design Systems, Cloudflare Pages, Dhaka, Remote" />
    <meta name="theme-color" content="#101313" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aetheria – Creative Director & Frontend Engineer Portfolio" />
    <meta
      property="og:description"
      content="Explore selected works, design systems, architectural UI/UX, and case studies by a senior creative engineer."
    />
    <meta property="og:site_name" content="Aetheria Portfolio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="bn_BD" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aetheria – Creative Director & Frontend Engineer Portfolio" />
    <meta
      name="twitter:description"
      content="Explore selected works, design systems, architectural UI/UX, and case studies by a senior creative engineer."
    />

    <!-- Google Web Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Shuvo Ahmed",
        "jobTitle": "Creative Director & Senior Frontend Engineer",
        "description": "Creative Director & Senior Frontend Engineer specializing in design systems, high-performance web applications, and tactile user interfaces.",
        "knowsAbout": [
          "React",
          "TypeScript",
          "Tailwind CSS",
          "UI/UX Design",
          "Design Systems",
          "Brand Architecture",
          "Web Performance"
        ],
        "worksFor": {
          "@type": "Organization",
          "name": "Independent Practice"
        }
      }
    </script>
  </head>
  <body class="bg-[#101313] text-[#F5F7F8] antialiased selection:bg-[#83AAB8]/30 selection:text-[#F5F7F8] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
